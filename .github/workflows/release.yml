name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build macOS package
        run: pnpm run build:mac
      - name: Smoke-test packaged application
        run: |
          export HENGCE_CAPTURE_PATH="$PWD/dist/HengCe-Apple-Silicon-Smoke.png"
          "dist/衡策.app/Contents/MacOS/衡策"
          test -s "$HENGCE_CAPTURE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: HengCe-macOS-Apple-Silicon
          path: |
            dist/HengCe-Apple-Silicon.dmg
            dist/HengCe-Apple-Silicon.dmg.sha256
            dist/HengCe-Apple-Silicon-Smoke.png
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build Windows packages
        run: pnpm run build:win
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $capture = Join-Path $PWD "dist\HengCe-Windows-x64-Smoke.png"
          $env:HENGCE_CAPTURE_PATH = $capture
          $process = Start-Process -FilePath "build\windows\package\HengCe-win32-x64\HengCe.exe" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "Smoke test timed out" }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $capture)) { throw "Smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: HengCe-Windows-x64
          path: |
            dist/HengCe-Windows-x64-Setup.exe
            dist/HengCe-Windows-x64-Setup.exe.sha256
            dist/HengCe-Windows-x64-Portable.zip
            dist/HengCe-Windows-x64-Portable.zip.sha256
            dist/HengCe-Windows-x64-Smoke.png
          if-no-files-found: error

  publish:
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --title "衡策 $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES_v0.3.0.md
